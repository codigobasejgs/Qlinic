<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Qlinic — ERP SaaS para clínicas. Ambiente de demonstração com dados fictícios." />
    <meta name="theme-color" content="#0D9488" />
    <link rel="icon" href="/brand/pwa/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/pwa/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/brand/pwa/apple-touch-icon.png" />
    <title>Qlinic — Sua clínica conectada ao cuidado</title>
    <script>
      try {
        var t = localStorage.getItem('qlinic.theme') || 'system'
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- ponytail: casca estática só para a landing (1º paint antes do JS). React substitui #root ao montar.
         Upgrade: pré-render por rota (SSG) se outras páginas públicas precisarem. -->
    <div id="root"><div id="static-shell" hidden style="max-width:1200px;margin:0 auto;padding:24px 16px;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:#102A43">
      <img src="/brand/svg/qlinic-logo-principal.svg" width="114" height="32" alt="Qlinic" />
      <h1 style="font-size:clamp(32px,5vw,56px);line-height:1.08;letter-spacing:-0.025em;margin:56px 0 16px;max-width:620px">Sua clínica conectada ao cuidado.</h1>
      <p style="font-size:18px;color:#526579;max-width:560px;margin:0">Agenda, recepção, prontuário por especialidade, financeiro, estoque e portal do paciente em um só lugar — com a marca da sua clínica e um app instalável para equipe e pacientes.</p>
    </div></div>
    <script>
      // Casca só na landing e no tema claro (evita flash na rota/tema errados).
      if (location.pathname === '/' && document.documentElement.dataset.theme !== 'dark') document.getElementById('static-shell').hidden = false
    </script>
    <noscript>O Qlinic precisa de JavaScript habilitado.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
